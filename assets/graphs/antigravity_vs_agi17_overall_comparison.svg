  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#8b949e" text-anchor="middle">Head-to-Head Verification Across Core Architectural Safeguards &amp; Operational Capabilities</text>

