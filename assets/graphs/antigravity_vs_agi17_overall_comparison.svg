  <text x="480" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#7d8590" text-anchor="middle">Standalone 2-Agent Head-to-Head Comparison | All AGI 1.7 metrics verified across 88 CI tests, 5 real Docker tests, and SQLite WAL persistence.</text>
